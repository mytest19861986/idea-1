<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Opportunity Intelligence Platform | Executive Intelligence Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0d14;
      --bg-secondary: #0f1422;
      --bg-surface: #141b2d;
      --bg-surface-elevated: #1b243b;
      --border-subtle: #232d46;
      --border-accent: #3b82f6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-purple: #a855f7;
      
      /* Evidence Classifications */
      --ev-fact: #10b981;
      --ev-claim: #38bdf8;
      --ev-derived: #a855f7;
      --ev-analysis: #f59e0b;
      --ev-hypothesis: #ec4899;
      --ev-unknown: #64748b;

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Terminal Navigation & Header */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .brand-logo {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-logo span {
      color: var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      background: rgba(56, 189, 248, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .terminal-status-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent-emerald);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Main Workspace Layout */
    .workspace {
      display: grid;
      grid-template-columns: 280px 1fr;
      flex: 1;
      min-height: calc(100vh - 60px);
    }

    /* Sidebar & Filter Controls */
    aside {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .filter-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .input-search, .select-control {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .input-search:focus, .select-control:focus {
      outline: none;
      border-color: var(--border-accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* Main Stream View */
    main {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .feed-stats {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .feed-stats strong { color: var(--text-primary); }

    /* Opportunity Cards */
    .opportunity-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .opp-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .opp-card:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--border-accent);
      transform: translateY(-1px);
    }
    .opp-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .opp-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }
    .opp-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .opp-summary {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 1rem;
    }
    .signal-strip {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Badges & Scores */
    .badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-transform: uppercase;
    }
    .badge-fact { background: rgba(16, 185, 129, 0.1); color: var(--ev-fact); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-claim { background: rgba(56, 189, 248, 0.1); color: var(--ev-claim); border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-derived { background: rgba(168, 85, 247, 0.1); color: var(--ev-derived); border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-confidential { background: rgba(244, 63, 94, 0.15); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.3); }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 0.4rem;
      min-width: 140px;
      border-left: 1px solid var(--border-subtle);
      padding-left: 1.5rem;
    }
    .score-primary {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }
    .score-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .confidence-meter {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border-subtle); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <div class="brand-logo">
        OPPORTUNITY INTEL <span>v1.0.0-PILOT</span>
      </div>
    </div>
    <div class="terminal-status-bar">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>PILOT_STATUS: ACTIVE</span>
      </div>
      <div>DATABASE: <span style="color:#fff;">POSTGRESQL 16 (DURABLE)</span></div>
      <div>GATES: <span style="color:var(--accent-emerald);">23/23 PASS</span></div>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <div class="filter-section">
        <label class="filter-label">Opportunity Search</label>
        <input type="text" class="input-search" id="searchInput" placeholder="Filter by domain, tech stack, keyword...">
      </div>

      <div class="filter-section">
        <label class="filter-label">Evidence Classification</label>
        <select class="select-control" id="evFilter">
          <option value="ALL">All Classifications</option>
          <option value="FACT">FACT (Verified)</option>
          <option value="SOURCE_CLAIM">SOURCE_CLAIM (Reported)</option>
          <option value="DERIVED_METRIC">DERIVED_METRIC (Calculated)</option>
        </select>
      </div>

      <div class="filter-section">
        <label class="filter-label">Access & Confidentiality</label>
        <select class="select-control" id="confFilter">
          <option value="ALL">All Listings</option>
          <option value="PUBLIC">Public Only</option>
          <option value="CONFIDENTIAL">Confidential / Stealth Only</option>
        </select>
      </div>

      <div class="filter-section">
        <label class="filter-label">Traction & Source Model</label>
        <select class="select-control" id="sourceFilter">
          <option value="ALL">All Authorized Sources</option>
          <option value="HN">Hacker News Official API</option>
          <option value="TRUSTMRR">TrustMRR Marketplace (Fixtures)</option>
        </select>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="feed-stats">
          Showing <strong id="oppCount">5</strong> Normalized Intelligence Opportunities
        </div>
        <div style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted);">
          PIPELINE: FAIL-CLOSED | IDEMPOTENT
        </div>
      </div>

      <div class="opportunity-grid" id="opportunityFeed">
        <!-- Cards rendered via JS -->
      </div>
    </main>
  </div>

  <script>
    // Canonical Opportunities Fixtures encompassing all 5 mandatory pilot tiers
    const OPPORTUNITY_FIXTURES = [
      {
        id: "opp-hn-live-001",
        title: "Show HN: Bolnee-Chat – Self Hosted Chatbot Integration in Your Business Website",
        sourceId: "hacker-news-official-api",
        isConfidential: false,
        publishedAt: "2026-08-30T09:56:05.000Z",
        author: "AniketWathore",
        summary: "Lightweight conversational AI integration widget for direct B2B customer support without third-party vendor lock-in.",
        opportunityScore: 84,
        evidenceConfidence: 72,
        evidenceType: "SOURCE_CLAIM",
        signals: [
          { name: "HN Upvotes", value: "29", type: "SOURCE_CLAIM" },
          { name: "Velocity", value: "6.7 pts/hr", type: "DERIVED_METRIC" },
          { name: "Tech Stack", value: "TypeScript, Go", type: "SOURCE_CLAIM" }
        ]
      },
      {
        id: "opp-trustmrr-001",
        title: "B2B SaaS Analytics Platform (High-Growth MRR)",
        sourceId: "trustmrr",
        isConfidential: false,
        publishedAt: "2026-08-29T14:20:00.000Z",
        author: "Verified Seller",
        summary: "Multi-tenant B2B analytics platform with verified Stripe integration metrics and strong product-market fit.",
        opportunityScore: 92,
        evidenceConfidence: 95,
        evidenceType: "FACT",
        signals: [
          { name: "MRR", value: "$24,500 / mo", type: "FACT" },
          { name: "MoM Growth", value: "+18.4%", type: "DERIVED_METRIC" },
          { name: "Verified By", value: "Stripe", type: "FACT" }
        ]
      },
      {
        id: "opp-stealth-002",
        title: "Confidential Stealth Opportunity #7742 (AI DevTools)",
        sourceId: "trustmrr",
        isConfidential: true,
        publishedAt: "2026-08-28T11:00:00.000Z",
        author: "[CONFIDENTIAL]",
        summary: "High-margin LLM observability framework operating in stealth acquisition mode. Identity and domain isolated.",
        opportunityScore: 78,
        evidenceConfidence: 65,
        evidenceType: "SOURCE_CLAIM",
        signals: [
          { name: "Reported ARR", value: "$180,000", type: "SOURCE_CLAIM" },
          { name: "Domain Leakage", value: "ZERO (Isolated)", type: "FACT" }
        ]
      },
      {
        id: "opp-hn-live-002",
        title: "Show HN: C# Game Engine with Scripting Language and Integrated IDE",
        sourceId: "hacker-news-official-api",
        isConfidential: false,
        publishedAt: "2026-08-30T10:12:00.000Z",
        author: "gamedev_lead",
        summary: "Custom cross-platform lightweight 2D/3D game development framework targeting indie developers.",
        opportunityScore: 71,
        evidenceConfidence: 68,
        evidenceType: "SOURCE_CLAIM",
        signals: [
          { name: "HN Upvotes", value: "48", type: "SOURCE_CLAIM" },
          { name: "Engagement", value: "High", type: "AI_ANALYSIS" }
        ]
      },
      {
        id: "opp-speculative-003",
        title: "Localized AI Legal Document Assistant (Emerging Gap)",
        sourceId: "speculative-market-gap",
        isConfidential: false,
        publishedAt: "2026-08-27T08:30:00.000Z",
        author: "Intelligence Engine",
        summary: "Identified high market gap in mid-tier corporate regulatory compliance automation in DACH region.",
        opportunityScore: 89,
        evidenceConfidence: 45,
        evidenceType: "AI_HYPOTHESIS",
        signals: [
          { name: "Market Gap Score", value: "9.2 / 10", type: "AI_ANALYSIS" },
          { name: "Ground Truth Evidence", value: "Pending Verification", type: "AI_HYPOTHESIS" }
        ]
      }
    ];

    function renderFeed(items) {
      const feedContainer = document.getElementById("opportunityFeed");
      document.getElementById("oppCount").innerText = items.length;

      feedContainer.innerHTML = items.map(item => `
        <div class="opp-card">
          <div>
            <div class="opp-header">
              <span class="opp-title">${item.title}</span>
              ${item.isConfidential ? '<span class="badge badge-confidential">🔒 CONFIDENTIAL</span>' : ''}
              <span class="badge ${item.evidenceType === 'FACT' ? 'badge-fact' : item.evidenceType === 'DERIVED_METRIC' ? 'badge-derived' : 'badge-claim'}">
                ${item.evidenceType}
              </span>
            </div>
            <div class="opp-meta">
              <span>Source: <strong>${item.sourceId}</strong></span>
              <span>Author: <strong>${item.author}</strong></span>
              <span>Published: ${new Date(item.publishedAt).toLocaleDateString()}</span>
            </div>
            <div class="opp-summary">${item.summary}</div>
            <div class="signal-strip">
              ${item.signals.map(s => `
                <span class="badge badge-claim" style="font-size:0.75rem;">
                  ${s.name}: <strong style="color:#fff; margin-left:0.2rem;">${s.value}</strong>
                </span>
              `).join('')}
            </div>
          </div>
          <div class="score-box">
            <span class="score-label">Opportunity Score</span>
            <span class="score-primary">${item.opportunityScore}</span>
            <span class="score-label" style="margin-top:0.5rem;">Evidence Confidence</span>
            <span class="confidence-meter" style="color:${item.evidenceConfidence >= 80 ? 'var(--accent-emerald)' : 'var(--accent-amber)'}">
              ${item.evidenceConfidence}%
            </span>
          </div>
        </div>
      `).join('');
    }

    // Initial render
    renderFeed(OPPORTUNITY_FIXTURES);

    // Search and Filter Handlers
    function applyFilters() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const ev = document.getElementById("evFilter").value;
      const conf = document.getElementById("confFilter").value;

      const filtered = OPPORTUNITY_FIXTURES.filter(item => {
        const matchesQ = item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q);
        const matchesEv = ev === "ALL" || item.evidenceType === ev;
        const matchesConf = conf === "ALL" || (conf === "CONFIDENTIAL" ? item.isConfidential : !item.isConfidential);
        return matchesQ && matchesEv && matchesConf;
      });

      renderFeed(filtered);
    }

    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("evFilter").addEventListener("change", applyFilters);
    document.getElementById("confFilter").addEventListener("change", applyFilters);
  </script>
</body>
</html>
